name: Deploy to GitHub Pages

on:
  push:
    branches: [ custom ]
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/custom'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Obsidian content
        uses: actions/checkout@v4
        with:
          repository: sephymartin/obsidian
          path: .obsidian-source
          ssh-key: ${{ secrets.OBSIDIAN_DEPLOY_KEY }}

      - name: Sync blog posts
        run: |
          test -d .obsidian-source/Blog
          rm -rf src/content/posts
          mkdir -p src/content/posts
          rsync -a --delete --include='*/' --include='*.md' --exclude='*' .obsidian-source/Blog/ src/content/posts/
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Build site
        run: pnpm run build

      - name: Create .nojekyll file
        run: touch dist/.nojekyll
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist  # Astro默认构建输出目录

  deploy:
    if: github.ref == 'refs/heads/custom'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    if: always() && github.ref == 'refs/heads/custom'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Notify deployment success in Feishu
        if: needs.build.result == 'success' && needs.deploy.result == 'success'
        uses: sephymartin-lab/forge-actions/.github/actions/feishu-notify@main
        with:
          webhook: ${{ secrets.FEISHU_WEBHOOK_URL }}
          status: success
          title: "博客部署成功"
          summary: "${{ github.repository }} 的 GitHub Pages 部署成功。"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ref-name: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          actor: ${{ github.actor }}
          repository: ${{ github.repository }}
          workflow: ${{ github.workflow }}
          run-number: ${{ github.run_number }}
          event-name: ${{ github.event_name }}

      - name: Notify deployment failure in Feishu
        if: needs.build.result != 'success' || needs.deploy.result != 'success'
        uses: sephymartin-lab/forge-actions/.github/actions/feishu-notify@main
        with:
          webhook: ${{ secrets.FEISHU_WEBHOOK_URL }}
          status: failure
          title: "博客部署失败"
          summary: "${{ github.repository }} 的 GitHub Pages 部署失败，请打开 Actions 查看详细错误。"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ref-name: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          actor: ${{ github.actor }}
          repository: ${{ github.repository }}
          workflow: ${{ github.workflow }}
          run-number: ${{ github.run_number }}
          event-name: ${{ github.event_name }}
